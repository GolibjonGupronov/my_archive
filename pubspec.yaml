name: my_archive
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  go_router: ^17.5.0
  easy_localization: ^3.0.8
  flutter_alice: ^2.0.1
  dio: ^5.11.0
  http: ^1.6.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_screenutil: ^5.9.3
  overlay_support: ^2.1.0
  adaptive_theme: ^3.7.2
  intl: ^0.20.2
  get: ^4.7.3
  equatable: ^2.1.0
  flutter_svg: ^2.3.0
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  calendar_date_picker2: ^3.0.0
  pinput: ^6.0.2
  dynamic_height_grid_view: ^0.0.4
  bottom_sheet: ^4.0.4
  modal_bottom_sheet: ^3.0.0
  fluttertoast: ^10.0.0
  image_cropper: ^12.2.1
  permission_handler: ^13.0.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.2
  file_picker: ^12.0.0
  shimmer: ^4.0.0
  collection: ^1.19.1
  video_player: ^2.11.1
  percent_indicator: ^4.2.5
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.3.0

  firebase_messaging: ^16.5.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  build_runner: ^2.15.1

flutter_gen:
  output: lib/core/utils/generated/
  line_length: 120

  integrations:
    image: true
    flutter_svg: true
    lottie: true
#    rive: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/languages/
    - assets/fonts/
    - .env

  fonts:
    - family: Aeonik-Pro
      fonts:
        - asset: assets/fonts/aeonik_pro/Aeonik-Pro-Black.ttf
          weight: 900
        - asset: assets/fonts/aeonik_pro/Aeonik-Pro-Bold.ttf
          weight: 700
        - asset: assets/fonts/aeonik_pro/Aeonik-Pro-Medium.ttf
          weight: 500
        - asset: assets/fonts/aeonik_pro/Aeonik-Pro-Regular.ttf
          weight: 400